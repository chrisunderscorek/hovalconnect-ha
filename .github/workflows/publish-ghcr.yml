name: Publish GHCR app image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-ghcr.yml
      - custom_components/hovalconnect/**
      - hovalconnect/**
  workflow_dispatch:

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/chrisunderscorek/hovalconnect-ha

jobs:
  metadata:
    name: Read release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read and validate app version
        id: version
        shell: bash
        run: |
          app_version="$(awk -F: '$1 == "version" { print $2; exit }' hovalconnect/config.yaml | tr -d ' "')"
          manifest_version="$(python3 -c 'import json; print(json.load(open("custom_components/hovalconnect/manifest.json", encoding="utf-8")).get("version", ""))')"
          if [[ -z "${app_version}" ]]; then
            echo "Could not read version from hovalconnect/config.yaml" >&2
            exit 1
          fi
          if [[ "${app_version}" != "${manifest_version}" ]]; then
            echo "Version mismatch: hovalconnect/config.yaml is ${app_version}, manifest.json is ${manifest_version}" >&2
            exit 1
          fi
          echo "version=${app_version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.hass_arch }}
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            hass_arch: amd64
          - platform: linux/arm64
            hass_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hovalconnect/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
            BUILD_ARCH=${{ matrix.hass_arch }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.metadata.outputs.version }}-${{ matrix.hass_arch }}

  manifest:
    name: Publish multi-arch tags
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.metadata.outputs.version }}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${{ needs.metadata.outputs.version }}-amd64" \
            "${IMAGE}:${{ needs.metadata.outputs.version }}-aarch64"

      - name: Create or update GitHub release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const version = "${{ needs.metadata.outputs.version }}";
            const tag = `v${version}`;
            const changelog = fs.readFileSync("hovalconnect/CHANGELOG.md", "utf8");
            const bodyLines = [];
            let inSection = false;

            for (const line of changelog.split(/\r?\n/)) {
              if (line.startsWith("## ")) {
                if (inSection) {
                  break;
                }
                inSection = line.includes(version);
                continue;
              }
              if (inSection) {
                bodyLines.push(line);
              }
            }

            const body = bodyLines.join("\n").trim() || `Release ${version}`;
            const { owner, repo } = context.repo;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name: version,
                body,
                draft: false,
                prerelease: false,
                make_latest: "true",
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: version,
                body,
                draft: false,
                prerelease: false,
                make_latest: "true",
              });
            }
