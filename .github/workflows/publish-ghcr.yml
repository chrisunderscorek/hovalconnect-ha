name: Publish GHCR app image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-ghcr.yml
      - custom_components/hovalconnect/**
      - hovalconnect/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/chrisunderscorek/hovalconnect-ha

jobs:
  build:
    name: Build ${{ matrix.hass_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            hass_arch: amd64
          - platform: linux/arm64
            hass_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          version="$(awk -F: '$1 == "version" { print $2; exit }' hovalconnect/config.yaml | tr -d ' "')"
          if [[ -z "${version}" ]]; then
            echo "Could not read version from hovalconnect/config.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hovalconnect/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_VERSION=${{ steps.app_version.outputs.version }}
            BUILD_ARCH=${{ matrix.hass_arch }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.app_version.outputs.version }}-${{ matrix.hass_arch }}

  manifest:
    name: Publish multi-arch tags
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          version="$(awk -F: '$1 == "version" { print $2; exit }' hovalconnect/config.yaml | tr -d ' "')"
          if [[ -z "${version}" ]]; then
            echo "Could not read version from hovalconnect/config.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.app_version.outputs.version }}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${{ steps.app_version.outputs.version }}-amd64" \
            "${IMAGE}:${{ steps.app_version.outputs.version }}-aarch64"
